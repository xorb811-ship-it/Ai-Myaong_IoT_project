<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Ai-Myaong 시스템 아키텍처</title>
  <desc id="desc">웹과 모바일 앱, FastAPI 백엔드, HiveMQ, Raspberry Pi 로봇, ESP32 디스펜서, 데스크톱 비전 워커, Oracle과 Supabase의 데이터 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity=".12"/></filter>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#2563EB"/></marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#7C3AED"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#059669"/></marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;fill:#172033}
      .title{font-size:40px;font-weight:800}.sub{font-size:17px;fill:#64748B}.lane{font-size:16px;font-weight:800;letter-spacing:1px}
      .h{font-size:22px;font-weight:800}.b{font-size:15px;fill:#475569}.s{font-size:13px;fill:#64748B}.label{font-size:14px;font-weight:700}
      .chip{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1;rx:9}
      .box{fill:white;stroke:#CBD5E1;stroke-width:1.5;rx:18;filter:url(#shadow)}
      .blue{stroke:#2563EB;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
      .purple{stroke:#7C3AED;stroke-width:3;fill:none;marker-end:url(#arrowPurple)}
      .green{stroke:#059669;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}
      .dash{stroke-dasharray:9 8}.muted{stroke:#94A3B8;stroke-width:2.5;fill:none;marker-end:url(#arrowBlue);stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Ai-Myaong 시스템 아키텍처</text>
  <text x="70" y="105" class="sub">AI 비전 · 원격 로봇 · 자동 급식/급수 · 건강 리포트를 연결하는 반려묘 AIoT 플랫폼</text>
  <rect x="70" y="135" width="1660" height="70" rx="18" fill="#172033"/>
  <text x="100" y="178" style="fill:#FFFFFF" class="lane">사용자 영역</text>
  <text x="330" y="178" style="fill:#BFDBFE" class="label">보호자 웹 브라우저 / 모바일 앱  →  HTTPS REST API (기본) · WebSocket (선택적 실시간) · MJPEG</text>
  <rect x="70" y="225" width="1660" height="315" rx="24" fill="#FFFFFF" opacity=".68" stroke="#DCE3EE"/>
  <text x="95" y="258" class="lane" fill="#2563EB">APPLICATION &amp; CLOUD</text>

  <rect class="box" x="105" y="290" width="260" height="155"/>
  <circle cx="145" cy="328" r="20" fill="#DBEAFE"/><text x="138" y="335" font-size="22">◉</text>
  <text x="178" y="330" class="h">클라이언트</text>
  <text x="130" y="367" class="b">React + Vite Web</text><text x="130" y="393" class="b">React Native + Expo</text>
  <text x="130" y="421" class="s">대시보드 · 로봇 · 급식/급수 · 알림</text>

  <rect class="box" x="505" y="270" width="400" height="215" stroke="#93C5FD"/>
  <rect x="505" y="270" width="400" height="47" rx="18" fill="#EFF6FF"/><text x="535" y="301" class="h">FastAPI Backend</text>
  <text x="535" y="343" class="b">인증·사용자·반려묘·설정</text><text x="535" y="370" class="b">로봇·디스펜서 명령 / 예약 스케줄러</text>
  <text x="535" y="397" class="b">비전 이벤트·활동량·미디어·알림</text><text x="535" y="424" class="b">건강 리포트·보존 정책</text>
  <rect x="535" y="444" width="150" height="25" rx="12" fill="#E0E7FF"/><text x="553" y="462" class="s">Device Simulator</text>
  <text x="700" y="462" class="s">하드웨어 없는 개발 지원</text>

  <rect class="box" x="1035" y="290" width="255" height="155" stroke="#C4B5FD"/>
  <text x="1065" y="330" class="h">HiveMQ Cloud</text><text x="1065" y="365" class="b">MQTT Broker · TLS 8883</text>
  <text x="1065" y="393" class="s">명령 publish / 상태 subscribe</text><text x="1065" y="421" class="s">로봇·센서·디스펜서 토픽</text>

  <rect class="box" x="1400" y="267" width="280" height="92"/>
  <text x="1428" y="305" class="h">Oracle DB</text><text x="1428" y="334" class="s">계정·반려묘·로그·활동·리포트·알림</text>
  <rect class="box" x="1400" y="380" width="280" height="92"/>
  <text x="1428" y="418" class="h">Supabase Storage</text><text x="1428" y="447" class="s">사용자 / 반려묘 이미지 객체 저장</text>

  <path class="blue" d="M365 345H490"/><text x="380" y="332" class="label" fill="#2563EB">HTTP/HTTPS REST API</text>
  <path class="blue" d="M490 405H370"/><text x="382" y="430" class="label" fill="#2563EB">JSON 응답</text>
  <path class="purple" d="M905 340H1020"/><text x="925" y="326" class="label" fill="#7C3AED">명령 Publish</text>
  <path class="purple" d="M1020 400H910"/><text x="925" y="422" class="label" fill="#7C3AED">상태 Subscribe</text>
  <path class="blue" d="M905 290V245H1540V267"/><text x="1165" y="237" class="label" fill="#2563EB">SQLAlchemy · 저장 / 조회</text>
  <path class="blue" d="M905 445V510H1540V472"/><text x="1115" y="502" class="label" fill="#2563EB">이미지 업로드 / 공개 URL</text>

  <rect x="70" y="565" width="1660" height="505" rx="24" fill="#FFFFFF" opacity=".7" stroke="#DCE3EE"/>
  <text x="95" y="600" class="lane" fill="#059669">EDGE · VISION · HARDWARE</text>

  <rect class="box" x="610" y="635" width="350" height="225" stroke="#86EFAC"/>
  <rect x="610" y="635" width="350" height="47" rx="18" fill="#ECFDF5"/><text x="640" y="666" class="h">Raspberry Pi Robot Agent</text>
  <text x="640" y="710" class="b">Pi Camera → MJPEG Server :8081</text><text x="640" y="740" class="b">MQTT 명령 검증 · HMAC 옵션</text>
  <text x="640" y="770" class="b">USB Serial Bridge :115200</text><text x="640" y="800" class="b">후방 초음파 센서값 상향 전송</text>
  <text x="640" y="833" class="s">Wi-Fi 설정 · 백엔드 자동 탐색/announce</text>

  <rect class="box" x="610" y="910" width="350" height="125"/>
  <text x="640" y="949" class="h">Arduino Uno</text><text x="640" y="982" class="b">크롤러 DC 모터 · 카메라 Pan/Tilt</text><text x="640" y="1010" class="s">초음파 센서 → Serial 피드백</text>

  <rect class="box" x="110" y="635" width="350" height="225" stroke="#A5B4FC"/>
  <rect x="110" y="635" width="350" height="47" rx="18" fill="#EEF2FF"/><text x="140" y="666" class="h">Desktop Vision Worker</text>
  <text x="140" y="710" class="b">OpenCV + YOLO Detection / Pose</text><text x="140" y="740" class="b">활동량 · 낙상/무동작 · 외출 침입 감지</text>
  <text x="140" y="770" class="b">캡처 / 클립 / 긴급 이벤트 생성</text><text x="140" y="800" class="b">분석 프레임 MJPEG 제공</text>
  <text x="140" y="833" class="s">Backend Vision API로 결과·미디어 전송</text>

  <rect class="box" x="1110" y="635" width="410" height="225" stroke="#FBBF24"/>
  <rect x="1110" y="635" width="410" height="47" rx="18" fill="#FFFBEB"/><text x="1140" y="666" class="h">ESP32 Smart Dispenser</text>
  <text x="1140" y="710" class="b">HiveMQ Cloud 직접 연결 · TLS</text><text x="1140" y="740" class="b">사료 모터 · 워터 펌프 · 긴급 정지</text>
  <text x="1140" y="770" class="b">로드셀: 사료/물 잔량·실배출량</text><text x="1140" y="800" class="b">고양이 감지 기반 예약 급수</text>
  <text x="1140" y="833" class="s">Wi-Fi AP 설정 포털 · NTP · 상태 publish</text>

  <rect class="box" x="1110" y="910" width="410" height="125" stroke="#FCA5A5"/>
  <text x="1140" y="949" class="h">OpenAI API</text><text x="1140" y="982" class="b">급식·급수·활동·자세 기반 건강 조언</text><text x="1140" y="1010" class="s">실패 시 안전한 기본 리포트 반환</text>

  <path class="purple" d="M1090 445V575H785V620"/><text x="825" y="566" class="label" fill="#7C3AED">로봇 명령</text>
  <path class="purple" d="M820 620V590H1060V445"/><text x="875" y="610" class="label" fill="#7C3AED">센서 상태</text>
  <path class="purple" d="M1230 445V575H1315V620"/><text x="1244" y="566" class="label" fill="#7C3AED">디스펜서 명령</text>
  <path class="purple" d="M1350 620V590H1265V445"/><text x="1365" y="608" class="label" fill="#7C3AED">무게·배출·상태</text>
  <path class="green" d="M785 860V895"/><path class="green" d="M820 895V865"/><text x="835" y="895" class="label" fill="#059669">USB Serial</text>
  <path class="green" d="M610 705H475"/><text x="500" y="691" class="label" fill="#059669">MJPEG</text>
  <path class="green" d="M285 620V555H650V485"/><text x="330" y="546" class="label" fill="#059669">Vision REST / Media</text>
  <path class="green" d="M705 485V610H785V620"/><text x="716" y="535" class="label" fill="#059669">MJPEG Proxy</text>
  <path class="blue" d="M870 485H990V895H1240V910"/><text x="1005" y="705" class="label" fill="#2563EB">Health summary</text>
  <path class="blue" d="M1200 910H975V500H850V485"/><text x="1000" y="895" class="label" fill="#2563EB">JSON report</text>

  <rect x="70" y="1095" width="1660" height="65" rx="16" fill="#FFFFFF" stroke="#DCE3EE"/>
  <path class="blue" d="M105 1127H165"/><text x="180" y="1133" class="s">HTTPS / API / 데이터</text>
  <path class="purple" d="M405 1127H465"/><text x="480" y="1133" class="s">MQTT 비동기 메시지</text>
  <path class="green" d="M735 1127H795"/><text x="810" y="1133" class="s">Edge 영상·Serial 흐름</text>
  <path class="muted" d="M1110 1127H1170"/><text x="1185" y="1133" class="s">시뮬레이션 / 선택적 대체 경로</text>
  <text x="1540" y="1133" text-anchor="middle" class="s">기준: 2026-07-22 코드</text>
</svg>
